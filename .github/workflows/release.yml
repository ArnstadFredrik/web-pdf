name: Release (Mac-app + Docker-image)

# Kjøres når en release publiseres (tag v*.*.* eller «Publish release» i UI).
# Bygger Mac-app (dmg/zip) og Docker-image, og legger begge i releasen.
on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  mac-app:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install || yarn install --network-timeout 600000

      - name: Build static SPA
        run: npx --yes -p cross-env cross-env ADAPTER=static npx vite build

      - name: Build Mac app
        run: npx electron-builder --mac
        env:
          # Uten Apple Developer-signering: bygg uregistrert (ad hoc)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach app to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
